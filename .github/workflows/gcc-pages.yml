name: GCC Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gcc-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css sw.js manifest.webmanifest icon-192.png icon-512.png _site/
          node scripts/update-status.mjs https://status.cloud.google.com/incidents.json _site/status.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

